<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../my-favicon/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../../my-favicon/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../../../my-favicon/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../../my-favicon/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../../../my-favicon/favicon/site.webmanifest" />
    <title>Chaining Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Use the classes BELOW this line -->
    <div>
      <img class="avatar proportioned" src="https://snipboard.io/aKmqb9.jpg" alt="Woman with glasses">
      <img class="avatar distorted" src="https://snipboard.io/tYM9B6.jpg" alt="Man with surprised expression">
    </div>
    <!-- Use the classes ABOVE this line -->
    <div>
      <img class="original proportioned" src="https://snipboard.io/aKmqb9.jpg" alt="Woman with glasses">
      <img class="original distorted" src="https://snipboard.io/tYM9B6.jpg" alt="Man with surprised expression">
    </div>
  </body>
</html>
